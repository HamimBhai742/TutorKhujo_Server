services:
  # ---------------------------------------------------------
  # 1. PostgreSQL Database Service
  # ---------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: tutorkhujo_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tutor_khujo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tutor_khujo}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tutorkhujo_net

  # ---------------------------------------------------------
  # 2. Redis Cache Service
  # ---------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: tutorkhujo_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tutorkhujo_net

  # ---------------------------------------------------------
  # 3. Node.js Express Backend Service
  # ---------------------------------------------------------
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tutorkhujo_server
    restart: always
    ports:
      - "${SERVER_PORT:-5026}:5026"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx prisma db push && node dist/server.js"
    env_file:
      - .env
    environment:
      PORT: 5026
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-tutor_khujo}?schema=public
      REDIS_URL: redis://redis:6379
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5026/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - tutorkhujo_net

