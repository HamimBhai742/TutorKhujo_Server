services:
  # ---------------------------------------------------------
  # 1. PostgreSQL Database Service
  # ---------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: tutorkhujo_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tutor_khujo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tutor_khujo}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tutorkhujo_net

  # ---------------------------------------------------------
  # 2. Redis Cache Service
  # ---------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: tutorkhujo_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tutorkhujo_net

  # ---------------------------------------------------------
  # 3. Node.js Express Backend Service
  # ---------------------------------------------------------
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tutorkhujo_server
    restart: always
    ports:
      - "${SERVER_PORT:-5026}:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/tutor_khujo?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - tutorkhujo_net

  # ---------------------------------------------------------
  # 4. Next.js Frontend Client Service
  # ---------------------------------------------------------
  client:
    build:
      context: ../TutorKhujo
      dockerfile: Dockerfile
    container_name: tutorkhujo_client
    restart: always
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    depends_on:
      server:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5026/api/v1}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - tutorkhujo_net

volumes:
  postgres_data:
  redis_data:

networks:
  tutorkhujo_net:
    driver: bridge
