version: '3.8'

services:
  # ---------------------------------------------------------
  # 1. PostgreSQL Database Service
  # ---------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: tutorkhujo_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tutor_khujo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tutor_khujo"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------
  # 2. Redis Cache Service
  # ---------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: tutorkhujo_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------
  # 3. Node.js Express Application Service
  # ---------------------------------------------------------
  server:
    build: .
    container_name: tutorkhujo_server
    restart: always
    ports:
      - "5026:5000" # Map container Express port 5000 to host port 5026
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tutor_khujo?schema=public
      REDIS_URL: redis://redis:6379
      PASSWORD_SALT: 10
      JWT_SECRET: "HY76GWTE57390EAIDSDFI76EASR7YHTGFR86STFR0IG98T874GHDJGISD78T75SRTF"
      JWT_EXPIRES_IN: "1d"
      NODE_ENV: production
      SMTP_HOST: "smtp.gmail.com"
      SMTP_PORT: 587
      SMTP_USER: "mdhamim5088@gmail.com"
      SMTP_PASS: "rgbp ktgb tuos vizy"
      SMTP_FROM: "TutorKhujo <mdhamim5088@gmail.com>"
      ADMIN_EMAIL: "admintutorkhujo@gmail.com"
